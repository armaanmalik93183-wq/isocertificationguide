<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="google-site-verification" content="YyJDwVkSVNOMCP-VrUmtS4LdXW80X78HNrhmNCN_fAU" />
    <meta name="description" content="Professional ISO certification blogs and compliance insights">
    <meta name="keywords" content="ISO Certification, ISO Saudi Arabia, ISO Blogs">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="ISO Certification Guide">
    <meta property="og:type" content="website">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISO Certification Guide</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        @keyframes dynamicMesh {
            0%, 100% { transform: translate(0px, 0px) scale(1) rotate(0deg); }
            33% { transform: translate(50px, -40px) scale(1.15) rotate(120deg); }
            66% { transform: translate(-30px, 50px) scale(0.9) rotate(240deg); }
        }
        .animate-mesh-1 { animation: dynamicMesh 22s linear infinite; }
        .animate-mesh-2 { animation: dynamicMesh 26s linear infinite reverse; }
        .hero-iso-bg { position:absolute; top:50%; right:-350px; width:1300px; transform:translateY(-50%); opacity:.18; pointer-events:none; z-index:1; animation:heroFloat 10s ease-in-out infinite; }
        @keyframes heroFloat{ 0%,100%{ transform:translateY(-50%); } 50%{ transform:translateY(calc(-50% - 15px)); } }
    </style>
</head>
    
<body class="bg-[#030612] antialiased selection:bg-cyan-500/20 selection:text-cyan-300">
<section class="relative min-h-screen flex flex-col justify-between overflow-hidden pb-16 pt-6">
    <header class="w-full z-50 relative px-6 max-w-7xl mx-auto">
        <div class="w-full bg-slate-950/30 border border-white/[0.05] rounded-3xl px-8 py-5 flex justify-between items-center backdrop-blur-2xl shadow-2xl">
            <a href="index.html" class="text-xl font-black text-white tracking-tight">ISO Certification Guide</a>
        </div>
    </header>

    <div class="relative z-10 max-w-7xl mx-auto px-6 w-full my-auto pt-20">
        </div>
</section>

<section id="articles-view" class="max-w-7xl mx-auto px-6 py-20 bg-[#030612] relative z-20 border-t border-white/[0.03]">
    <div id="posts-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8"></div>
    <div id="pagination" class="flex justify-center items-center gap-3 mt-12">
        <button id="prevPage" class="px-4 py-2 bg-slate-800 text-white rounded-lg hover:bg-cyan-500 transition">Previous</button>
        <span id="pageInfo" class="text-slate-300 font-medium"></span>
        <button id="nextPage" class="px-4 py-2 bg-slate-800 text-white rounded-lg hover:bg-cyan-500 transition">Next</button>
    </div>
</section>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAq3IgYIFu7l6N_mKNVcyfWKDp1akTauDs",
  authDomain: "iso-certification-guide.firebaseapp.com",
  databaseURL: "https://iso-certification-guide-default-rtdb.firebaseio.com",
  projectId: "iso-certification-guide",
  storageBucket: "iso-certification-guide.firebasestorage.app",
  messagingSenderId: "277771367161",
  appId: "1:277771367161:web:0f61aef15bb9ce0d64a828"
};

firebase.initializeApp(firebaseConfig);
const database = firebase.database();
let allPosts = [];
const postsPerPage = 8;
let currentPage = 1;

database.ref('blogs').on('value', (snapshot) => {
    const data = snapshot.val();
    const container = document.getElementById('posts-container');
    container.innerHTML = '';
    if (!data) return;
    allPosts = Object.keys(data).map(key => ({ id: key, ...data[key] }));
    renderPosts(allPosts, currentPage);
});

function renderPosts(posts, page = 1) {
    const container = document.getElementById('posts-container');
    container.innerHTML = '';
    const paginatedPosts = [...posts].reverse().slice((page - 1) * postsPerPage, page * postsPerPage);

    paginatedPosts.forEach(post => {
        const snippet = post.content ? post.content.replace(/<[^>]+>/g, '').substring(0, 110) : '';
        const articleSlug = post.slug ? post.slug.trim() : post.id;
        // FIXED URL FORMAT: blog.html?slug=...
        const articleUrl = `blog.html?slug=${encodeURIComponent(articleSlug)}`;

        container.innerHTML += `
            <article class="bg-[#080d1a] rounded-[24px] overflow-hidden shadow-sm hover:shadow-2xl border border-white/[0.04] p-6 flex flex-col justify-between">
                <div>
                    <img src="${post.image}" class="w-full h-40 object-cover rounded-xl mb-4">
                    <h3 class="text-lg font-bold text-slate-100">${post.title}</h3>
                    <p class="mt-3 text-slate-400 text-sm">${snippet}...</p>
                </div>
                <a href="${articleUrl}" class="mt-6 block text-center bg-cyan-600 text-white py-3 rounded-xl font-bold text-sm">
                    Read Blueprint
                </a>
            </article>
        `;
    });
    updatePagination(posts);
}

function updatePagination(posts) {
    const totalPages = Math.ceil(posts.length / postsPerPage);
    document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
    document.getElementById('prevPage').disabled = currentPage === 1;
    document.getElementById('nextPage').disabled = currentPage === totalPages;
}
</script>
</body>
</html>
