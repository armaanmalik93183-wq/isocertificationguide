<!DOCTYPE html>

body{
    font-family: 'Inter', sans-serif;
}

    background:
    linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)),
    url('https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?q=80&w=2070');
    background-size: cover;
    background-position: center;
}

</style>

<body class="bg-slate-50">

<!-- NAVBAR -->
<header class="bg-white border-b sticky top-0 z-50">

<div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

<div>
<h1 class="text-2xl font-extrabold text-blue-600">
ISO Certification Guide
</h1>
</div>

<nav class="flex items-center gap-4">

<a href="index.html" class="text-slate-700 font-medium hover:text-blue-600">
Home
</a>

<a href="admin.html" class="bg-blue-600 text-white px-5 py-2 rounded-xl hover:bg-blue-700 transition">
Admin Panel
</a>

</nav>

</div>

</header>

<!-- HERO -->
<section class="hero-bg text-white py-32">

<div class="max-w-4xl mx-auto px-6 text-center">

<h2 class="text-6xl font-extrabold leading-tight">
Professional ISO Certification Insights
</h2>

<p class="mt-6 text-xl text-slate-200 leading-relaxed">
Latest ISO certification guides, audit preparation strategies,
compliance insights, and implementation tutorials.
</p>

<div class="mt-8">

<input
type="text"
id="searchInput"
placeholder="Search articles..."
class="w-full max-w-2xl px-6 py-4 rounded-2xl text-slate-900 outline-none text-lg"
/>

</div>

</div>

</section>

<!-- BLOGS -->
<section class="max-w-7xl mx-auto px-6 py-16">

<div class="flex justify-between items-center mb-10">

<h2 class="text-4xl font-bold text-slate-800">
Latest Articles
</h2>

</div>

<div id="blog-container"
class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8">
</div>

</section>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAq3IgYIFu7l6N_mKNVcyfWKDp1akTauDs",
  authDomain: "iso-certification-guide.firebaseapp.com",
  databaseURL: "https://iso-certification-guide-default-rtdb.firebaseio.com",
  projectId: "iso-certification-guide",
  storageBucket: "iso-certification-guide.firebasestorage.app",
  messagingSenderId: "277771367161",
  appId: "1:277771367161:web:0f61aef15bb9ce0d64a828",
  measurementId: "G-MJL8MBRQEB"
};
firebase.initializeApp(firebaseConfig);

const database = firebase.database();

let allPosts = [];

database.ref('blogs').on('value', (snapshot) => {

    const container = document.getElementById('blog-container');

    container.innerHTML = '';

    const data = snapshot.val();

    if(!data){

        container.innerHTML = `
        <div class="col-span-full text-center text-slate-500 py-20">
            No Articles Published Yet
        </div>
        `;

        return;

    }

    allPosts = Object.keys(data).map(key => ({
        id:key,
        ...data[key]
    }));

    renderPosts(allPosts);

});

function renderPosts(posts){

    const container = document.getElementById('blog-container');

    container.innerHTML = '';

    posts.sort((a,b)=>b.timestamp-a.timestamp);

    posts.forEach(post => {

        const snippet = post.content.substring(0,150);

        container.innerHTML += `

       <article class="bg-white rounded-3xl overflow-hidden shadow-sm border hover:shadow-xl transition duration-300">

    <!-- BLOG IMAGE -->
    <img
    src="${post.image}"
    class="w-full h-56 object-cover"
    />

    <div class="p-8">

        <span class="text-blue-600 text-sm font-semibold">
            ${post.date}
        </span>

        <h3 class="text-2xl font-bold mt-3 text-slate-800 leading-snug">
            ${post.title}
        </h3>

        <p class="mt-4 text-slate-600 leading-relaxed">
            ${snippet}...
        </p>

        <a href="post.html?id=${post.id}"
        class="inline-block mt-6 bg-slate-900 text-white px-5 py-3 rounded-xl hover:bg-black transition">
            Read More
        </a>

    </div>

</article>

        `;

    });

}

document.getElementById('searchInput').addEventListener('input', function(){

    const value = this.value.toLowerCase();

    const filtered = allPosts.filter(post =>
        post.title.toLowerCase().includes(value)
    );

    renderPosts(filtered);

});

</script>

</body>
</html>
