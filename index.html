<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISO Certification Guide & Insights</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600 tracking-wide">ISO Certification Guide</h1>
            <nav class="space-x-4">
                <a href="index.html" class="text-gray-600 hover:text-blue-600 font-medium">Home</a>
                <a href="admin.html" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-blue-700 transition">Admin Panel</a>
            </nav>
        </div>
    </header>

    <section class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white py-16 px-4 text-center">
        <div class="max-w-3xl mx-auto">
            <h2 class="text-4xl font-extrabold mb-4">Expert Compliance & ISO Management System Insights</h2>
            <p class="text-blue-100 text-lg">Step-by-step implementation guides, compliance updates, and audit frameworks tailored for business growth.</p>
        </div>
    </section>

    <main class="max-w-6xl mx-auto px-4 py-12">
        <h3 class="text-2xl font-bold mb-8 text-gray-900">Latest Articles</h3>
        <div id="blog-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <div class="col-span-full text-center py-12 text-gray-500">Loading dynamic insights feed...</div>
        </div>
    </main>

    <div id="read-modal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 overflow-y-auto p-4 flex items-center justify-center">
        <div class="bg-white w-full max-w-3xl rounded-xl shadow-2xl p-6 relative max-h-[90vh] overflow-y-auto animate-fade-in">
            <button onclick="closePost()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
            <span id="modal-date" class="text-xs text-blue-600 font-semibold uppercase tracking-wider"></span>
            <h2 id="modal-title" class="text-3xl font-bold mt-2 mb-4 text-gray-900"></h2>
            <div id="modal-content" class="text-gray-700 leading-relaxed whitespace-pre-wrap text-base"></div>
        </div>
    </div>

    <script>
        // Paste your Firebase Config keys here:
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Global Object variable storage for post caching
        let localPosts = {};

        // Fetch updates from Realtime DB
        database.ref('blogs').on('value', (snapshot) => {
            const container = document.getElementById('blog-container');
            container.innerHTML = '';
            const data = snapshot.val();

            if (!data) {
                container.innerHTML = '<p class="col-span-full text-center py-12 text-gray-500">No blog entries published yet.</p>';
                return;
            }

            localPosts = data;

            // Sort posts chronologically by timestamp (newest first)
            const sortedKeys = Object.keys(data).sort((a, b) => data[b].timestamp - data[a].timestamp);

            sortedKeys.forEach((key) => {
                const post = data[key];
                const cleanSnippet = post.content.substring(0, 120) + (post.content.length > 120 ? '...' : '');
                
                const cardHTML = `
                    <article class="bg-white rounded-xl shadow-md border border-gray-100 overflow-hidden flex flex-col justify-between hover:shadow-lg transition duration-200">
                        <div class="p-6">
                            <div class="text-xs font-semibold text-blue-600 uppercase tracking-wider mb-2">${post.date}</div>
                            <h4 class="text-xl font-bold mb-3 text-gray-900 line-clamp-2">${post.title}</h4>
                            <p class="text-gray-600 text-sm leading-relaxed">${cleanSnippet}</p>
                        </div>
                        <div class="p-6 pt-0">
                            <button onclick="viewPost('${key}')" class="text-blue-600 font-semibold text-sm inline-flex items-center hover:text-blue-800 transition">
                                Read Full Article &rarr;
                            </button>
                        </div>
                    </article>
                `;
                container.innerHTML += cardHTML;
            });
        });

        function viewPost(key) {
            const post = localPosts[key];
            document.getElementById('modal-title').innerText = post.title;
            document.getElementById('modal-date').innerText = post.date;
            document.getElementById('modal-content').innerText = post.content;
            document.getElementById('read-modal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closePost() {
            document.getElementById('read-modal').classList.add('hidden');
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
