<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Professional Blog Admin Panel</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    body{
      font-family: 'Inter', sans-serif;
    }

    .sidebar-link:hover{
      background: #1e293b;
    }

    .glass{
      backdrop-filter: blur(10px);
      background: rgba(255,255,255,0.7);
    }
  </style>
</head>

<body class="bg-slate-100">

<!-- LOGIN SCREEN -->
<div id="auth-gate" class="fixed inset-0 bg-slate-950 flex items-center justify-center z-50 px-4">

  <div class="bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl">

    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-blue-600 rounded-2xl mx-auto flex items-center justify-center text-white text-2xl font-bold">
        A
      </div>

      <h1 class="text-3xl font-bold mt-4 text-slate-800">
        Admin Login
      </h1>

      <p class="text-slate-500 mt-2">
        Secure access to your dashboard
      </p>
    </div>

    <input
      type="password"
      id="gate-pass"
      placeholder="Enter Password"
      class="w-full border border-slate-300 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
    >

    <button
      onclick="unlockDashboard()"
      class="w-full mt-4 bg-blue-600 hover:bg-blue-700 transition text-white py-3 rounded-xl font-semibold"
    >
      Login Dashboard
    </button>

    <p id="gate-error" class="hidden text-red-500 text-sm mt-4 text-center">
      Incorrect Password
    </p>

  </div>

</div>

<!-- MAIN DASHBOARD -->
<div id="dashboard-ui" class="hidden min-h-screen flex">

  <!-- SIDEBAR -->
  <aside class="w-72 bg-slate-950 text-white min-h-screen p-6">

<div class="mb-12">

<h1 class="text-3xl font-extrabold text-blue-500">
ISO Admin
</h1>

<p class="text-slate-400 mt-2">
Professional CMS Dashboard
</p>

</div>

<nav class="space-y-3">

<button onclick="showSection('dashboard')"
class="w-full text-left px-4 py-3 rounded-xl bg-slate-900 hover:bg-slate-800 transition">
Dashboard
</button>

<button onclick="showSection('analytics')"
class="w-full text-left px-4 py-3 rounded-xl hover:bg-slate-800 transition">
Analytics
</button>

<button onclick="showSection('settings')"
class="w-full text-left px-4 py-3 rounded-xl hover:bg-slate-800 transition">
Settings
</button>

</nav>

</aside>
  <!-- CONTENT -->
  <main class="flex-1">

    <!-- TOPBAR -->
    <header class="bg-white border-b px-8 py-5 flex justify-between items-center">

      <div>
        <h1 class="text-2xl font-bold text-slate-800">
          Dashboard
        </h1>

        <p class="text-slate-500 text-sm">
          Welcome back admin
        </p>
      </div>

      <a href="index.html"
         class="bg-slate-900 hover:bg-black text-white px-5 py-2 rounded-xl text-sm font-medium transition">
        Visit Website
      </a>

    </header>

    <!-- DASHBOARD STATS -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-6 p-8">

      <div class="bg-white rounded-2xl p-6 shadow-sm border">
        <p class="text-slate-500 text-sm">Total Posts</p>
        <h2 id="total-posts" class="text-4xl font-bold mt-2">0</h2>
      </div>

      <div class="bg-white rounded-2xl p-6 shadow-sm border">
        <p class="text-slate-500 text-sm">Database Status</p>
        <h2 class="text-2xl font-bold mt-2 text-green-600">
          Connected
        </h2>
      </div>

      <div class="bg-white rounded-2xl p-6 shadow-sm border">
        <p class="text-slate-500 text-sm">Admin Access</p>
        <h2 class="text-2xl font-bold mt-2 text-blue-600">
          Active
        </h2>
      </div>

    </section>

    <!-- MAIN GRID -->
    <section class="grid grid-cols-1 xl:grid-cols-3 gap-8 px-8 pb-8">

      <!-- CREATE POST -->
      <div class="xl:col-span-1 bg-white rounded-2xl shadow-sm border p-6 h-fit">

        <h2 class="text-xl font-bold text-slate-800 mb-6">
          Create New Post
        </h2>

        <form id="post-form" onsubmit="publishArticle(event)" class="space-y-5">

          <div>
            <label class="text-sm font-medium text-slate-700 block mb-2">
              Post Title
            </label>

            <input
              type="text"
              id="post-title"
              required
              class="w-full border border-slate-300 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Enter title"
            >
          </div>

          <div>
            <label class="text-sm font-medium text-slate-700 block mb-2">
              Article Content
            </label>

            <textarea
              id="post-content"
              rows="10"
              required
              class="w-full border border-slate-300 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Write article..."
            ></textarea>
          </div>

          <button
            type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 transition text-white py-3 rounded-xl font-semibold"
          >
            Publish Post
          </button>

        </form>

      </div>

      <!-- POSTS -->
      <div class="xl:col-span-2 bg-white rounded-2xl shadow-sm border p-6">

        <div class="flex justify-between items-center mb-6">
          <h2 class="text-xl font-bold text-slate-800">
            Published Posts
          </h2>
        </div>

        <div id="admin-feed" class="space-y-4">
          <p class="text-slate-400">
            Loading posts...
          </p>
        </div>

      </div>

    </section>

  </main>

</div>

<script>

  // FIREBASE CONFIG
  const firebaseConfig = {
  apiKey: "AIzaSyAq3IgYIFu7l6N_mKNVcyfWKDp1akTauDs",
  authDomain: "iso-certification-guide.firebaseapp.com",
  databaseURL: "https://iso-certification-guide-default-rtdb.firebaseio.com",
  projectId: "iso-certification-guide",
  storageBucket: "iso-certification-guide.firebasestorage.app",
  messagingSenderId: "277771367161",
  appId: "1:277771367161:web:0f61aef15bb9ce0d64a828",
  measurementId: "G-MJL8MBRQEB"
};

  firebase.initializeApp(firebaseConfig);

  const database = firebase.database();

  // ADMIN PASSWORD
  const SECRET_PASSPHRASE = "admin123";

  // LOGIN
  function unlockDashboard() {

      const input = document.getElementById('gate-pass').value;

      if(input === SECRET_PASSPHRASE){

          document.getElementById('auth-gate').classList.add('hidden');

          document.getElementById('dashboard-ui').classList.remove('hidden');

          loadAdminArticlesFeed();

      } else {

          document.getElementById('gate-error').classList.remove('hidden');

      }

  }

  // CREATE POST
  function publishArticle(e){

      e.preventDefault();

      const title = document.getElementById('post-title').value;

      const content = document.getElementById('post-content').value;

      const today = new Date().toLocaleDateString();

      database.ref('blogs').push({
          title,
          content,
          date: today,
          timestamp: Date.now()
      })

      .then(() => {

          document.getElementById('post-form').reset();

          alert('Post Published Successfully');

      })

      .catch((err) => {

          alert(err.message);

      });

  }

  // LOAD POSTS
  function loadAdminArticlesFeed(){

      database.ref('blogs').on('value', (snapshot) => {

          const feed = document.getElementById('admin-feed');

          feed.innerHTML = '';

          const data = snapshot.val();

          if(!data){

              feed.innerHTML = `
                <div class="text-slate-400">
                  No posts available
                </div>
              `;

              return;

          }

          const totalPosts = Object.keys(data).length;

          document.getElementById('total-posts').innerText = totalPosts;

          Object.keys(data)
          .sort((a,b) => data[b].timestamp - data[a].timestamp)
          .forEach((key) => {

              const post = data[key];

              feed.innerHTML += `

                <div class="border border-slate-200 rounded-2xl p-5 hover:shadow-md transition">

                    <div class="flex justify-between items-start gap-4">

                        <div>

                            <h3 class="font-bold text-lg text-slate-800">
                              ${post.title}
                            </h3>

                            <p class="text-sm text-slate-500 mt-1">
                              Published on ${post.date}
                            </p>

                        </div>

                        <button
                          onclick="dropArticle('${key}')"
                          class="bg-red-50 hover:bg-red-100 text-red-600 px-4 py-2 rounded-xl text-sm font-medium transition"
                        >
                          Delete
                        </button>

                    </div>

                </div>

              `;

          });

      });

  }

  // DELETE POST
  function dropArticle(key){

      if(confirm('Delete this post permanently?')){

          database.ref('blogs/' + key).remove();

      }

  }

</script>

</body>
</html>
