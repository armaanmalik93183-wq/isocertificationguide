<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://armaanmalik93183-wq.github.io/isocertificationguide/blog.html" />

    <title>ISO Certification Guide</title>
    <meta name="description" content="Professional ISO certification insights and compliance guides">
    <meta property="og:title" content="ISO Certification Guide">
    <meta property="og:description" content="Professional ISO certification insights and compliance guides">
    <meta property="og:type" content="article">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        body { background:#f1f5f9; font-family:Arial,sans-serif; }
        .article-content { line-height:2; font-size:18px; color:#334155; text-align:justify; }
        .article-content h1, .article-content h2, .article-content h3 { font-weight:800; margin-top:35px; margin-bottom:15px; color:#0f172a; }
        .article-content img { width:100%; border-radius:25px; margin:30px 0; }
        .hero-bg { background: linear-gradient(90deg, #020617, #001B44, #020617); }
    </style>
</head>

<body>
    <section class="hero-bg text-white pb-16">
        <div class="max-w-7xl mx-auto px-6">
            <nav class="pt-8">
                <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl px-8 py-5 flex justify-between">
                    <a href="index.html" class="font-black text-3xl">ISO Certification Guide</a>
                    <a href="index.html" class="hover:text-blue-400 transition">Articles</a>
                </div>
            </nav>
            <div class="grid lg:grid-cols-2 gap-20 items-center pt-16">
                <div>
                    <h1 id="hero-title" class="text-5xl md:text-6xl font-black">Loading...</h1>
                    <p id="date" class="mt-8 text-slate-400">Loading date...</p>
                </div>
                <img id="featured-image" src="" alt="" class="rounded-[35px] w-full shadow-2xl hidden">
            </div>
        </div>
    </section>

    <section class="max-w-7xl mx-auto px-6 py-16">
        <div class="bg-white p-14 rounded-[35px] shadow-sm">
            <div id="content" class="article-content">Loading article...</div>
        </div>
    </section>

    <script>
    const firebaseConfig = {
        apiKey: "AIzaSyAq3IgYIFu7l6N_mKNVcyfWKDp1akTauDs",
        authDomain: "iso-certification-guide.firebaseapp.com",
        databaseURL: "https://iso-certification-guide-default-rtdb.firebaseio.com",
        projectId: "iso-certification-guide",
        storageBucket: "iso-certification-guide.firebasestorage.app",
        messagingSenderId: "277771367161",
        appId: "1:277771367161:web:0f61aef15bb9ce0d64a828"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // FIXED: Simplified logic using URLSearchParams directly
    const urlParams = new URLSearchParams(window.location.search);
    const currentSlug = urlParams.get("slug");

    if (currentSlug) {
        database.ref("blogs").orderByChild("slug").equalTo(currentSlug).once("value")
        .then(snapshot => {
            const data = snapshot.val();
            if (data) {
                const id = Object.keys(data)[0];
                const post = data[id];
                
                // Set metadata
                document.title = post.title + " | ISO Certification Guide";
                document.getElementById("hero-title").innerText = post.title;
                document.getElementById("date").innerText = post.date;
                document.getElementById("content").innerHTML = post.content;
                
                const featuredImg = document.getElementById("featured-image");
                featuredImg.src = post.image;
                featuredImg.classList.remove("hidden");
            } else {
                show404Error();
            }
        })
        .catch(err => show404Error());
    } else {
        show404Error();
    }

    function show404Error() {
        document.getElementById("hero-title").innerText = "Article Not Found";
        document.getElementById("content").innerHTML = `<div class="text-center py-10"><h3 class="text-3xl font-bold">Article not found</h3><a href="index.html" class="inline-block mt-6 bg-blue-600 text-white px-6 py-3 rounded-xl">Back Home</a></div>`;
    }
    </script>
</body>
</html>
