<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blog Article</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

</head>

<body class="bg-slate-100">

<header class="bg-white border-b">

<div class="max-w-5xl mx-auto px-6 py-5 flex justify-between">

<a href="index.html" class="font-bold text-blue-600 text-2xl">
ISO Guide
</a>

<a href="index.html" class="text-slate-700">
← Back
</a>

</div>

</header>

<main class="max-w-4xl mx-auto py-16 px-6">

<div class="bg-white rounded-3xl p-10 shadow-sm">

<p id="date" class="text-blue-600 font-semibold"></p>

<h1 id="title" class="text-5xl font-extrabold text-slate-900 mt-4 leading-tight"></h1>

<div id="content"
class="mt-10 text-lg text-slate-700 leading-loose whitespace-pre-wrap">
</div>

</div>

</main>

<script>

const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    databaseURL: "YOUR_DATABASE_URL",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
    appId: "YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);

const database = firebase.database();

const urlParams = new URLSearchParams(window.location.search);

const id = urlParams.get('id');

database.ref('blogs/' + id).once('value')
.then(snapshot => {

    const post = snapshot.val();

    document.getElementById('title').innerText = post.title;

    document.getElementById('date').innerText = post.date;

    document.getElementById('content').innerText = post.content;

});

</script>

</body>
</html>
