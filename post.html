<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Blog Article</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<style>

body{
    font-family:'Inter',sans-serif;
}

/* BLOG CONTENT */

#content{
    font-size:20px;
    line-height:2;
    color:#334155;
    text-align:justify;
}

#content p{
    margin-bottom:28px;
}

#content h1{
    font-size:48px;
    font-weight:800;
    margin-top:40px;
    margin-bottom:25px;
    color:#0f172a;
    line-height:1.2;
}

#content h2{
    font-size:38px;
    font-weight:800;
    margin-top:35px;
    margin-bottom:20px;
    color:#0f172a;
    line-height:1.3;
}

#content h3{
    font-size:30px;
    font-weight:700;
    margin-top:30px;
    margin-bottom:18px;
    color:#0f172a;
}

#content ul,
#content ol{
    padding-left:30px;
    margin-bottom:25px;
}

#content li{
    margin-bottom:12px;
}

#content img{
    width:100%;
    border-radius:24px;
    margin:40px 0;
}

#content blockquote{
    border-left:5px solid #2563eb;
    padding-left:25px;
    margin:35px 0;
    font-style:italic;
    color:#475569;
}

#content a{
    color:#2563eb;
    text-decoration:underline;
}

/* RESPONSIVE */

@media(max-width:768px){

#content{
    font-size:17px;
}

#content h1{
    font-size:34px;
}

#content h2{
    font-size:28px;
}

#content h3{
    font-size:24px;
}

}

</style>

</head>

<body class="bg-slate-100">

<!-- HEADER -->
<header class="bg-white border-b sticky top-0 z-50">

<div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">

<a href="index.html"
class="text-3xl font-extrabold text-blue-600">
ISO Guide
</a>

<a href="index.html"
class="text-slate-700 hover:text-blue-600 transition font-medium">
← Back
</a>

</div>

</header>

<!-- BLOG -->
<main class="py-16">

<div class="max-w-5xl mx-auto px-6">

<article class="bg-white rounded-[40px] overflow-hidden shadow-sm border">

<!-- FEATURED IMAGE -->
<img
id="featured-image"
class="w-full h-[500px] object-cover"
/>

<!-- CONTENT -->
<div class="p-8 md:p-16">

<p id="date"
class="text-blue-600 font-semibold text-lg">
</p>

<h1 id="title"
class="text-5xl md:text-7xl font-extrabold text-slate-900 leading-tight mt-4">
</h1>

<div id="content"
class="mt-14">
</div>

</div>

</article>

</div>

</main>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAq3IgYIFu7l6N_mKNVcyfWKDp1akTauDs",
  authDomain: "iso-certification-guide.firebaseapp.com",
  databaseURL: "https://iso-certification-guide-default-rtdb.firebaseio.com",
  projectId: "iso-certification-guide",
  storageBucket: "iso-certification-guide.firebasestorage.app",
  messagingSenderId: "277771367161",
  appId: "1:277771367161:web:0f61aef15bb9ce0d64a828"
};

firebase.initializeApp(firebaseConfig);

const database = firebase.database();

const urlParams = new URLSearchParams(window.location.search);

const id = urlParams.get('id');

database.ref('blogs/' + id).once('value')
.then(snapshot => {

const post = snapshot.val();

// FEATURED IMAGE
document.getElementById('featured-image').src = post.image;

// TITLE
document.getElementById('title').innerText = post.title;

// DATE
document.getElementById('date').innerText = post.date;

// CONTENT
document.getElementById('content').innerHTML = post.content;

});

</script>

</body>
</html>
