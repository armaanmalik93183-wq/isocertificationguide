<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <style>

#content h1{
    font-size: 40px;
    font-weight: 800;
    margin-top: 30px;
    margin-bottom: 20px;
}

#content h2{
    font-size: 32px;
    font-weight: 700;
    margin-top: 25px;
    margin-bottom: 15px;
}

#content h3{
    font-size: 26px;
    font-weight: 700;
    margin-top: 20px;
    margin-bottom: 10px;
}

#content p{
    margin-bottom: 20px;
    line-height: 1.9;
}

#content img{
    border-radius: 20px;
    margin: 30px 0;
}

#content ul{
    padding-left: 20px;
    margin-bottom: 20px;
}

#content blockquote{
    border-left: 4px solid #2563eb;
    padding-left: 20px;
    margin: 20px 0;
    font-style: italic;
}

</style>

<title>Blog Article</title>

<script src="https://cdn.tailwindcss.com"></script>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

</head>

<body class="bg-slate-100">

<header class="bg-white border-b">

<div class="max-w-5xl mx-auto px-6 py-5 flex justify-between">

<a href="index.html" class="font-bold text-blue-600 text-2xl">
ISO Guide
</a>

<a href="index.html" class="text-slate-700">
← Back
</a>

</div>

</header>

<main class="max-w-4xl mx-auto py-16 px-6">

<div class="bg-white rounded-3xl p-10 shadow-sm">

<p id="date" class="text-blue-600 font-semibold"></p>

<h1 id="title" class="text-5xl font-extrabold text-slate-900 mt-4 leading-tight"></h1>

<div id="content"
class="mt-10 text-lg text-slate-700 leading-loose whitespace-pre-wrap">
</div>

</div>

</main>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyAq3IgYIFu7l6N_mKNVcyfWKDp1akTauDs",
  authDomain: "iso-certification-guide.firebaseapp.com",
  databaseURL: "https://iso-certification-guide-default-rtdb.firebaseio.com",
  projectId: "iso-certification-guide",
  storageBucket: "iso-certification-guide.firebasestorage.app",
  messagingSenderId: "277771367161",
  appId: "1:277771367161:web:0f61aef15bb9ce0d64a828",
  measurementId: "G-MJL8MBRQEB"
};

firebase.initializeApp(firebaseConfig);

const database = firebase.database();

const urlParams = new URLSearchParams(window.location.search);

const id = urlParams.get('id');

database.ref('blogs/' + id).once('value')
.then(snapshot => {

    const post = snapshot.val();

    document.getElementById('title').innerText = post.title;

    document.getElementById('date').innerText = post.date;

    // IMPORTANT FIX
    document.getElementById('content').innerHTML = post.content;

});

</script>
